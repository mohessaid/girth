name: fuzz

on:
  pull_request:
    paths: ["src/**", "fuzz/**"]
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [frontmatter, validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} (5 min on schedule, 1 min on PRs)
        run: |
          secs=60; [ "${{ github.event_name }}" = "pull_request" ] || secs=300
          cd fuzz && cargo fuzz run ${{ matrix.target }} -- -max_total_time=$secs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts
