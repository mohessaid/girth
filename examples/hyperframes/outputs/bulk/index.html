<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Ship faster with Girth</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0b0f14; color: #5b6572; font-family: system-ui, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #caption { display: flex; gap: 32px; font-size: 140px; font-weight: 800; letter-spacing: -2px; }
      .word { display: block; color: #5b6572; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="6">
      <section id="headline" class="clip" data-start="0" data-duration="6">
        <div id="caption">
          <span class="word" id="w0">Ship</span>
          <span class="word" id="w1">faster</span>
          <span class="word" id="w2">with</span>
          <span class="word" id="w3">Girth</span>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const starts = [0.5, 1.5, 2.5, 3.4];
      const ends = [1.5, 2.5, 3.4, 5.6];
      tl.from(".word", { y: 40, opacity: 0, duration: 0.5, stagger: 0.1, ease: "power3.out" }, 0.1);
      starts.forEach((s, i) => {
        tl.to("#w" + i, { color: "#ffffff", scale: 1.08, duration: 0.2, ease: "power2.out" }, s);
        if (i < 3) tl.to("#w" + i, { color: "#5b6572", scale: 1, duration: 0.2 }, ends[i]);
      });
      tl.to("#w3", { color: "#4ade80", duration: 0.3 }, 3.4);
      tl.to("#caption", { opacity: 0, duration: 0.4 }, 5.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
