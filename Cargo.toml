[package]
name = "girth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Just-in-time, project-scoped agent skills distilled from the skills you already have."
license = "MIT"

[[bin]]
name = "girth"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
yaml-rust2 = "0.13.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
